<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 50px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            min-height: 150px;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 36px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Hello World</h1>

        <p>
            This is a simple static HTML page for testing.
        </p>

        <a href="#" class="button">Test Button</a>

        <section class="grid">
            <div class="card">
                <h2>Card 01</h2>
                <p>Test content.</p>
            </div>

            <div class="card">
                <h2>Card 02</h2>
                <p>Test content.</p>
            </div>

            <div class="card">
                <h2>Card 03</h2>
                <p>Test content.</p>
            </div>
        </section>

    </main>

</body>
</html>
